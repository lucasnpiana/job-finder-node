
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Vaga | Job Finder</title>

    <!-- Aplica o tema salvo antes da página aparecer -->
    <script>
        (function () {
            var saved = null;
            try {
                saved = localStorage.getItem('theme');
            } catch (e) {}

            var theme = saved || (
                window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light'
            );

            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <!-- NAVBAR: mesma estrutura da index.html -->
    <header>
        <nav class="navbar fixed-top navbar-expand-md">
            <div class="container-fluid">

                <a class="navbar-brand" href="/">
                    Job Finder
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Abrir menu">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto align-items-md-center">

                        <li class="nav-item">
                            <a class="nav-link" href="/#vagas">
                                Ver Vagas
                            </a>
                        </li>

                        <li class="nav-item">
                            <button type="button"
                                    class="theme-toggle"
                                    id="themeToggle"
                                    aria-label="Alternar modo claro e escuro">
                            </button>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link btn btn-primary"
                               href="/add">
                                Abrir Vaga
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <!-- CONTEÚDO -->
    <main class="add-page">

        <div class="container">

            <div class="add-header">
                <h1>
                    Preencha os dados da melhor forma possível
                    para encontrar mais rápido seu dev!
                </h1>

                <p>
                    Compartilhe os detalhes da oportunidade e encontre
                    o profissional ideal para sua equipe.
                </p>
            </div>


            <!-- FORMULÁRIO -->
            <section class="add-form-card">

                <form action="/jobs/add" method="POST">

                    <!-- TÍTULO -->
                    <div class="add-form-group">

                        <label for="title" class="form-label">
                            Título da vaga
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            placeholder="Digite o título da vaga"
                            required
                        >

                        <small class="form-hint">
                            O título é muito importante, seja claro e objetivo.
                        </small>

                    </div>


                    <!-- DESCRIÇÃO -->
                    <div class="add-form-group">

                        <label for="description" class="form-label">
                            Descrição da vaga
                        </label>

                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Descreva as atividades do desenvolvedor..."
                            required
                        ></textarea>

                    </div>


                    <!-- EMPRESA -->
                    <div class="add-form-group">

                        <label for="company" class="form-label">
                            Empresa contratante
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="company"
                            name="company"
                            placeholder="Digite a empresa que vai contratar"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="add-form-group">

                        <label for="email" class="form-label">
                            E-mail para contato
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Digite o e-mail para contato"
                            required
                        >

                    </div>


                    <!-- SALÁRIO -->
                    <div class="add-form-group">

                        <label for="salary" class="form-label">
                            Salário oferecido
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="salary"
                            name="salary"
                            placeholder="Digite o salário da vaga"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <!-- VAGA NOVA -->
                    <div class="add-form-group">

                        <label for="new_job" class="form-label">
                            Vaga nova?
                        </label>

                        <select
                            class="form-select"
                            id="new_job"
                            name="new_job"
                            required
                        >
                            <option value="" selected disabled>
                                Selecione uma opção
                            </option>

                            <option value="1">Sim</option>
                            <option value="0">Não</option>
                        </select>

                    </div>


                    <!-- BOTÃO -->
                    <div class="add-form-actions">

                        <button type="submit" class="btn btn-primary">
                            Publicar vaga
                        </button>

                    </div>

                </form>

            </section>

        </div>

    </main>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>


    <!-- MESMO SCRIPT DE TEMA DA INDEX -->
    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('themeToggle');

            function render() {
                var dark = root.getAttribute('data-bs-theme') === 'dark';

                btn.textContent = dark ? '☀ Claro' : '☾ Escuro';
                btn.setAttribute('aria-pressed', dark);
            }

            btn.addEventListener('click', function () {
                var next = root.getAttribute('data-bs-theme') === 'dark'
                    ? 'light'
                    : 'dark';

                root.setAttribute('data-bs-theme', next);

                try {
                    localStorage.setItem('theme', next);
                } catch (e) {}

                render();
            });

            render();
        })();
    </script>

</body>
</html>
